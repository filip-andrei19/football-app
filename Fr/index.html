<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- === TAG-URI NOI PENTRU PWA (Aplicație Instalabilă) === -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#059669" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <title>ScoutPro Football</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- === SCRIPT ÎNREGISTRARE SERVICE WORKER === -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(reg => console.log('Service Worker a fost înregistrat cu succes!'))
            .catch(err => console.error('Eroare la înregistrarea Service Worker:', err));
        });
      }
    </script>
  </body>
</html>
