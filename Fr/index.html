<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Platforma oficială de Scouting Fotbal. Bază de date, transferuri și statistici." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#090D16" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Forțează browserul să nu țină cache la acest fișier HTML -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>România Scout | Scouting & Live Data</title>
    <style>
      .font-mono-stats {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body
    class="bg-[#F3F5F8] dark:bg-[#090D16] text-slate-900 dark:text-slate-100 antialiased overflow-x-hidden selection:bg-emerald-500/25 selection:text-emerald-300"
    style="font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- === SCRIPT ÎNREGISTRARE SERVICE WORKER (Comunică cu interfața) === -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(reg => {
              console.log('Service Worker înregistrat cu succes!');

              // Verifică dacă există un update (cod nou pe server)
              reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                installingWorker.onstatechange = () => {
                  if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    window.dispatchEvent(new CustomEvent('pwa-update-available', { detail: reg }));
                  }
                };
              };
            })
            .catch(err => console.error('Eroare SW:', err));
        });
      }
    </script>
  </body>
</html>
