<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Platforma oficială de Scouting Fotbal. Bază de date, transferuri și statistici." />
    
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#022c22" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <!-- Forțează browserul să nu țină cache la acest fișier HTML HTML -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>România Scout | Baza Oficială de Date</title>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-emerald-50 antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- === SCRIPT ÎNREGISTRARE SERVICE WORKER (Comunică cu interfața) === -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(reg => {
              console.log('Service Worker înregistrat cu succes!');
              
              // Verifică dacă există un update (cod nou pe server)
              reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                installingWorker.onstatechange = () => {
                  if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // În loc să dăm refresh automat, trimitem semnalul către App.tsx
                    // pentru a declanșa ecranul de blocare obligatoriu (overlay-ul)
                    window.dispatchEvent(new CustomEvent('pwa-update-available', { detail: reg }));
                  }
                };
              };
            })
            .catch(err => console.error('Eroare SW:', err));
        });
      }
    </script>
  </body>
</html>
